# HTTP — redirect to HTTPS + serve certbot challenges
server {
    listen 80;
    server_name money-tracker.hrxdev.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name money-tracker.hrxdev.cc;

    ssl_certificate     /etc/letsencrypt/live/money-tracker.hrxdev.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/money-tracker.hrxdev.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Mini App static files
    root /var/www/moneytracker;
    index index.html;

    # Hashed immutable assets — годовой кеш + честный 404 без SPA-fallback.
    # Без этого блока try_files в location / отдавал бы index.html для отсутствующих чанков,
    # и браузер ловил бы "Failed to fetch dynamically imported module" вместо понятного 404.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Top-level non-versioned static — короткий кеш с revalidate.
    location ~* ^/(favicon\.svg|favicon\.ico|manifest\.webmanifest|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback — index.html и client-side роуты никогда не кешируем,
    # чтобы Telegram WebView и обычные браузеры всегда получали актуальные chunk-references.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy (172.17.0.1 = docker bridge gateway, reaches host on Linux)
    location /api/ {
        proxy_pass         http://172.17.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
